[package]
name = "aeo-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Command-line tool for the AEO Protocol v0.1 — validate, fetch, and inspect AEO declaration documents."
license = "AGPL-3.0"
repository = "https://github.com/mizcausevic-dev/aeo-cli"
homepage = "https://github.com/mizcausevic-dev/aeo-cli"
readme = "README.md"
keywords = ["aeo", "well-known", "cli", "validator", "llm"]
categories = ["command-line-utilities"]

[[bin]]
name = "aeo"
path = "src/main.rs"

[dependencies]
aeo-protocol = { version = "0.1", default-features = false, features = ["client"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
colored = "3"
serde_json = "1"
