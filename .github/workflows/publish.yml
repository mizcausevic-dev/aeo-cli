name: Publish to crates.io

# Fires on a semver tag. Verifies Cargo.toml version matches the tag, then
# publishes aeo-cli to crates.io as a binary crate. Consumers can install via:
#   cargo install aeo-cli
#
# REQUIRED REPO SECRET: CARGO_REGISTRY_TOKEN
#   - Get a token at https://crates.io/settings/tokens with publish-new + publish-update scopes
#   - Add as repo secret CARGO_REGISTRY_TOKEN under Settings → Secrets and variables → Actions
#
# Note: cargo publish will fail until the package owner publishes v0.1.0 manually
# the first time (registry requires the initial publish from a token with
# "publish-new" scope on a never-before-seen crate name). Subsequent versions
# auto-publish via this workflow.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write   # for future OIDC trusted publishing

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(grep '^version = ' Cargo.toml | head -1 | cut -d '"' -f2)
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Git tag ($TAG) does not match Cargo.toml version ($PKG_VERSION)"
            exit 1
          fi
      - name: Build release binary (smoke check)
        run: cargo build --release --locked
      - name: Run tests
        run: cargo test --locked
      - name: Publish to crates.io
        run: cargo publish --token ${CARGO_REGISTRY_TOKEN}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
